const chinese = { level: 1, total: 10, current: null, lockInput: false };
const chineseRanges = {
  easy:   { poolSize: 10, options: 4 },
  medium: { poolSize: 15, options: 5 },
  hard:   { poolSize: 20, options: 5 },
};

const CHINESE_CARS = 5;    // 认字：5 节车厢，装满就出发

function startChinese() {
  chinese.level = 1;
  setupTrainCars(CHINESE_CARS);
  setupChinese();
}

function setupChinese() {
  const mode = settings.chineseMode === 'pic2word' ? 'pic2word' : 'word2pic';
  const isPic2Word = mode === 'pic2word';

  updateLevel(chinese.level, chinese.total);
  document.getElementById('feedback').textContent = '';

  const range = chineseRanges[settings.difficulty.chinese];
  const themePool = CHINESE_DATA[settings.chineseTheme] || CHINESE_DATA.animals;

  const poolSize = Math.min(range.poolSize, themePool.length);
  let pool;
  if (range.poolSize <= 10) {
    pool = themePool.slice(0, poolSize);
  } else {
    pool = shuffle(themePool).slice(0, poolSize);
  }

  chinese.current = pool[rand(0, pool.length - 1)];

  // 干扰项
  const numDistractors = range.options - 1;
  const candidates = pool.filter(item => item.word !== chinese.current.word);
  const distractors = shuffle(candidates).slice(0, numDistractors);
  while (distractors.length < numDistractors) {
    const extra = themePool[rand(0, themePool.length - 1)];
    if (!distractors.some(d => d.word === extra.word)) distractors.push(extra);
  }
  let options = shuffle([chinese.current, ...distractors]).slice(0, range.options);
  while (options.length < range.options) {
    const extra = themePool[rand(0, themePool.length - 1)];
    if (!options.some(o => o.word === extra.word)) options.push(extra);
  }

  const stageTitle = isPic2Word ? '看图，选对的字' : '看字，选对的图';
  const mainInner = isPic2Word
    ? `<div class="big-pic" id="chinesePicDisplay"></div>`
    : `<div class="big-char">${chinese.current.word}</div>`;

  document.getElementById('gameView').innerHTML = `
    <div class="game-stage">
      <div class="stage-toolbar">
        <div class="stage-title">${stageTitle}</div>
        <div class="stage-right">${diffMiniHtml('chinese')}${xpBarHtml(chineseXpKey())}</div>
      </div>
      <div class="character-display">
        ${mainInner}
      </div>
      <div class="pic-choices" id="chineseChoices"></div>
    </div>
  `;

  // 填充大展示区（SVG 或 emoji）
  if (isPic2Word) {
    const picEl = document.getElementById('chinesePicDisplay');
    const pic = chinese.current.pic;
    if (pic && pic.startsWith && pic.startsWith('<svg')) {
      picEl.innerHTML = pic;
    } else {
      picEl.textContent = pic;
    }
  }

  // 填充选项按钮
  const choicesEl = document.getElementById('chineseChoices');
  choicesEl.className = isPic2Word ? 'pic-choices pic-choices--text' : 'pic-choices';
  choicesEl.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = isPic2Word ? 'pic-btn pic-btn--text' : 'pic-btn';
    if (isPic2Word) {
      btn.textContent = opt.word;  // 看图选字：按钮显示中文字
    } else {
      const pic = opt.pic;
      if (pic && pic.startsWith && pic.startsWith('<svg')) {
        btn.innerHTML = pic;
      } else {
        btn.textContent = pic;
      }
    }
    btn.onclick = () => handleChinese(opt, btn);
    choicesEl.appendChild(btn);
  });

  chinese.lockInput = false;
  setTimeout(() => speak(chinese.current.word), 600);
}

function handleChinese(opt, btn) {
  if (chinese.lockInput) return;
  if (opt.word === chinese.current.word) {
    chinese.lockInput = true;
    addXp(chineseXpKey(), XP_PER_ANSWER);
    btn.classList.add('correct');
    showFeedback('🎉 对啦！');
    speak(`对啦，是${chinese.current.word}`);
    document.querySelectorAll('#chineseChoices .pic-btn').forEach(b => b.disabled = true);
    // 动物飞到火车
    const slotIdx = trainCars.indexOf(null);
    if (slotIdx >= 0) {
      trainCars[slotIdx] = opt.pic;
      const carEl = document.querySelector(`.train-car[data-slot="${slotIdx}"]`);
      if (carEl) flyAnimalToTrain(btn, opt.pic, carEl);
    }
    const isLastInGroup = (slotIdx === CHINESE_CARS - 1);   // 装满 5 节才发车
    setTimeout(() => {
      chinese.level++;
      if (chinese.level > chinese.total) {
        showWin('🎉 全认完啦 🎉', '小宝贝认识好多字！', '全认完啦，小宝贝认识好多字！');
      } else if (isLastInGroup) {
        departTrain();
      } else {
        setupChinese();
      }
    }, 1500);
  } else {
    btn.classList.add('wrong');
    lowerXp(chineseXpKey());
    showFeedback('🤔 再看看字');
    speak('再看看字');
    setTimeout(() => btn.classList.remove('wrong'), 500);
  }
}

// ===== XP 升级系统（每个游戏一条独立进度线）=====
const XP_PER_ANSWER = 10;
const XP_PENALTY    = 2;     // 答错扣分：只轻轻扣一点。重点在升级的正反馈，别打击尝试意愿
const XP_CURVE_MAX  = 10;    // 10 级以内曲线加速，之后每级固定
const XP_AFTER_MAX  = 350;
// 达到 lv 级所需的累计经验：Lv2=50(5题) Lv3=150 Lv4=300 … Lv10=2250，之后每级 +350
function xpAtLevel(lv) {
  if (lv <= XP_CURVE_MAX) return 25 * lv * (lv - 1);
  return 25 * XP_CURVE_MAX * (XP_CURVE_MAX - 1) + (lv - XP_CURVE_MAX) * XP_AFTER_MAX;
}
// 认字两个模式各自独立：看字选图 = chinese-w2p，看图选字 = chinese-p2w
function chineseXpKey() {
  return settings.chineseMode === 'pic2word' ? 'chinese-p2w' : 'chinese-w2p';
}

function xpOf(key) { return (settings.xp && settings.xp[key]) || 0; }
function levelOf(key) {
  const xp = xpOf(key);
  let lv = 1;
  while (lv < 999 && xp >= xpAtLevel(lv + 1)) lv++;
  return lv;
}

// 经验增减：amount 可为负（答错扣分），最低到 0 不会变负数
function addXp(key, amount) {
  if (!settings.xp || !(key in settings.xp)) return;
  const before = levelOf(key);
  settings.xp[key] = Math.max(0, xpOf(key) + amount);
  saveSettings();
  if (levelOf(key) > before) celebrateLevelUp(key);   // 只在升级时反馈，扣分不提示
  updateXpChips();
  updateHomeCards();
}

// 答错扣分
function lowerXp(key) { addXp(key, -XP_PENALTY); }

function xpBarHtml(key) {
  const xp = xpOf(key), lv = levelOf(key);
  const cur = xpAtLevel(lv), next = xpAtLevel(lv + 1);
  const pct = Math.max(0, Math.min(100, Math.round((xp - cur) / (next - cur) * 100)));
  return `<div class="xp-chip" data-xp-key="${key}">
    <span class="xp-lv">Lv.${lv}</span>
    <span class="xp-track"><span class="xp-fill" style="width:${pct}%"></span></span>
    <span class="xp-num">${xp - cur}/${next - cur}</span>
  </div>`;
}

function updateXpChips() {
  document.querySelectorAll('.xp-chip').forEach(chip => {
    const key = chip.dataset.xpKey;
    if (!settings.xp || !(key in settings.xp)) return;
    const xp = xpOf(key), lv = levelOf(key);
    const cur = xpAtLevel(lv), next = xpAtLevel(lv + 1);
    const pct = Math.max(0, Math.min(100, Math.round((xp - cur) / (next - cur) * 100)));
    chip.querySelector('.xp-lv').textContent = 'Lv.' + lv;
    chip.querySelector('.xp-fill').style.width = pct + '%';
    chip.querySelector('.xp-num').textContent = (xp - cur) + '/' + (next - cur);
  });
}

function updateHomeCards() {
  document.querySelectorAll('.game-card').forEach(card => {
    const key = card.dataset.xp;
    if (!settings.xp || !(key in settings.xp)) return;
    let badge = card.querySelector('.card-lv');
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'card-lv';
      card.appendChild(badge);
    }
    badge.textContent = 'Lv.' + levelOf(key);
  });
}

// 升级提示音：短促的高音「叮」。
// 刻意避开 playTrainHorn 的 C5-E5-G5-C6 triangle 上行琶音 —— 那样太像通关汽笛，
// 而且太长会打断答题节奏。改成 sine 软音色 + 高八度 + 不到 0.25 秒。
function playLevelUpDing() {
  playMelody([
    { note: 'E6', dur: 85 },
    { note: 'G6', dur: 145 },
  ], 'sine');
}

// 升级反馈：不弹窗、不需要点确认、不打断学习。
// 效果只落在等级徽章上：跳一下 + 叮一声，1.3 秒后自动复原。
function celebrateLevelUp(key) {
  playLevelUpDing();
  const chip = document.querySelector('.xp-chip[data-xp-key="' + key + '"]');
  if (!chip) return;
  chip.classList.add('xp-levelup');
  setTimeout(() => chip.classList.remove('xp-levelup'), 1300);
}

// ===== Bootstrap =====
loadSettings();
probeSysTTS();                 // 探测系统中文语音
// Android 上首次真实手势解锁系统 TTS
['pointerdown','touchstart','keydown'].forEach(ev =>
  window.addEventListener(ev, unlockSysTTS, { once: true, passive: true }));
updateHomeCards();
updateMusicBtn();
updateDiffBtns();
updateChineseThemeBtns();
document.getElementById('musicToggle').addEventListener('click', toggleMusic);
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-diff-game]');
  if (!btn) return;
  setDifficulty(btn.dataset.diffGame, btn.dataset.diff);
});
document.querySelectorAll('.theme-btn').forEach(b => {
  b.addEventListener('click', () => setChineseTheme(b.dataset.theme));
});
